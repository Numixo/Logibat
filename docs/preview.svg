<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Logibat — Your MX batteries. At a glance.</title>
<desc id="desc">Interface illustration of a macOS menu bar with a keyboard at 100 percent and a mouse at 65 percent. A USB receiver connects both devices. These are example readings.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a2b"/><stop offset="1" stop-color="#051619"/></linearGradient>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#244244"/><stop offset="1" stop-color="#193436"/></linearGradient>
 <filter id="shadow" x="-30%" y="-70%" width="160%" height="240%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-opacity=".25"/></filter>
 <g id="keyboard" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="37" height="25" rx="4"/><path d="M7 7h1m6 0h1m6 0h1m6 0h1M7 13h1m6 0h1m6 0h1m6 0h1M9 19h19"/></g>
 <g id="mouse" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="0" width="20" height="29" rx="10"/><path d="M10 5v6"/></g>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1060" cy="600" r="330" fill="#20483e" opacity=".22"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
 <text x="80" y="82" font-size="23" font-weight="650" fill="#a9e5ce" letter-spacing="2">LOGIBAT</text>
 <text x="80" y="186" font-size="63" font-weight="650" fill="#f4f8ef" letter-spacing="-2">Your MX batteries.</text>
 <text x="80" y="258" font-size="63" font-weight="650" fill="#f4f8ef" letter-spacing="-2">At a glance.</text>
 <text x="83" y="315" font-size="23" fill="#b0c8bf">A tiny, native macOS menu bar app.</text>
 <g filter="url(#shadow)">
  <rect x="80" y="366" width="1040" height="90" rx="22" fill="url(#card)" stroke="#56706a" stroke-opacity=".5"/>
  <circle cx="120" cy="411" r="5" fill="#a9e5ce"/><text x="144" y="419" font-size="20" font-weight="550" fill="#c0d5cd">Logibat</text>
  <path d="M261 390v42" stroke="#5a756d" stroke-opacity=".6"/>
  <text x="289" y="419" font-size="18" fill="#9db6ac">macOS menu bar</text>
  <g color="#f4f8ef"><use href="#keyboard" x="641" y="398"/><use href="#mouse" x="851" y="396"/></g>
  <g fill="#f4f8ef" font-size="31" font-weight="550"><text x="693" y="422">100%</text><text x="891" y="422">65%</text></g>
  <path d="M1003 390v42" stroke="#5a756d" stroke-opacity=".6"/>
  <text x="1027" y="419" font-size="20" fill="#c0d5cd">09:41</text>
 </g>
 <g font-size="19" fill="#c4d7ca"><text x="83" y="522">USB receiver support</text><circle cx="316" cy="515" r="2.5" fill="#a9e5ce"/><text x="340" y="522">No Logitech software required</text><circle cx="629" cy="515" r="2.5" fill="#a9e5ce"/><text x="653" y="522">Free &amp; open source</text></g>
 <text x="83" y="582" font-size="14" fill="#88a89b">Interface illustration · example readings · macOS 13+ · Apple silicon download</text>
</g>
</svg>
